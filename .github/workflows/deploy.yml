name: Build and Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        # Removed QEMU entirely (not needed for AMD-only builds)
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and Push (Single Step + Caching)
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            # We removed linux/arm64 here because your OCI Micro is amd64
            platforms: linux/amd64
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/telegrag-bot-api:latest
              ${{ secrets.DOCKER_USERNAME }}/telegrag-worker:latest
            # This caches layers so next builds only take seconds
            cache-from: type=gha
            cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/telegrag/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/telegrag
            # Rename prod file to standard name
            mv docker-compose.prod.yml docker-compose.yml
            
            # Pull new images
            docker compose pull
            
            # Restart containers (zero downtime for DB/Redis, brief downtime for API)
            docker compose up -d
            
            # Clean up old images to save disk space
            docker image prune -f